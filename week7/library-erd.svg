<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">ER-схема библиотеки</title>
  <desc id="desc">Книги связаны с авторами через book_authors, а с участниками через loans.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#57c7db" stroke-width="1.7"/>
    </marker>
  </defs>
  <rect width="1000" height="540" rx="18" fill="#101820"/>
  <text x="40" y="54" fill="#f0f4f8" font-family="Menlo, monospace" font-size="25" font-weight="700">LAB 9 · LIBRARY DATABASE</text>
  <text x="40" y="82" fill="#9db0c3" font-family="Menlo, monospace" font-size="15">1 → N  •  связи подтверждены внешними ключами в PostgreSQL</text>

  <g fill="none" stroke="#57c7db" stroke-width="3" marker-end="url(#arrow)">
    <path d="M300 165 L380 252"/>
    <path d="M300 375 L380 318"/>
    <path d="M820 220 L820 320"/>
    <path d="M60 165 L25 165 L25 490 L820 490 L820 460"/>
  </g>

  <g fill="#172838" stroke="#37536a" stroke-width="2">
    <rect x="60" y="110" width="240" height="110" rx="12"/>
    <rect x="60" y="320" width="240" height="110" rx="12"/>
    <rect x="380" y="210" width="240" height="140" rx="12"/>
    <rect x="700" y="110" width="240" height="110" rx="12"/>
    <rect x="700" y="320" width="240" height="140" rx="12"/>
  </g>

  <g fill="#76d9e8" font-family="Menlo, monospace" font-size="21" font-weight="700">
    <text x="82" y="145">books</text>
    <text x="82" y="355">authors</text>
    <text x="402" y="245">book_authors</text>
    <text x="722" y="145">members</text>
    <text x="722" y="355">loans</text>
  </g>
  <g fill="#dce7f1" font-family="Menlo, monospace" font-size="16">
    <text x="82" y="177">book_id  PK</text><text x="82" y="200">title · isbn</text>
    <text x="82" y="387">author_id  PK</text><text x="82" y="410">first_name · last_name</text>
    <text x="402" y="279">book_id  PK/FK</text><text x="402" y="306">author_id  PK/FK</text>
    <text x="722" y="177">member_id  PK</text><text x="722" y="200">first_name · email</text>
    <text x="722" y="389">loan_id  PK</text><text x="722" y="416">book_id · member_id  FK</text><text x="722" y="441">borrowed_on · due_on</text>
  </g>
</svg>
